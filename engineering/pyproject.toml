[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ai-engineering-harness"
dynamic = ["version"]
description = "AI Engineering Harness — engineering control plane (V1.3: context budget)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
harness = "orchestrator.cli:main"

[tool.hatch.version]
path = "orchestrator/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]
markers = [
    "mem0: needs a running self-hosted Mem0 server (opt-in: HARNESS_MEM0_INTEGRATION=1)",
    "jev: calls the real TypeSafe Jev API (opt-in: HARNESS_JEV_INTEGRATION=1)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert and spawn subprocesses on purpose.
"tests/**" = ["S101", "S603"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["orchestrator"]
plugins = ["pydantic.mypy"]
